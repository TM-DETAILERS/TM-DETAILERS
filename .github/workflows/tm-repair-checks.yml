name: TM Detailers repair checks

on:
  push:
    branches:
      - 'repair/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate site files and booking workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check pages, imports and syntax
        run: node tests/recovery-audit.mjs static
      - name: Exercise isolated SQLite booking API
        run: node tests/recovery-audit.mjs api
      - name: Install browser test runner
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Verify Owner Studio company controls in Chrome
        run: node tests/company-ui.mjs
